version: '3.8'

services:
  webapi:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=HarvestHub;Username=postgres;Password=postgres123;
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: HarvestHub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
